# STREAMFORGE_NATIVE_TLS_HEADERS_V37
map $http_x_forwarded_proto $streamforge_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
map $http_x_forwarded_host $streamforge_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}
map $http_x_forwarded_port $streamforge_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

# STREAMFORGE_RELAY_ERROR_ONLY_ACCESS_LOG_V1036: relay HLS is high-frequency
# internal Node/FFmpeg traffic. Suppress successful 2xx/3xx relay requests from
# the normal Nginx access log while preserving 4xx/5xx relay failures.
map $status $streamforge_relay_access_loggable {
    ~^[45] 1;
    default 0;
}

upstream streamforge_main_backend {
    server 127.0.0.1:8800;
    keepalive 512;
}

upstream streamforge_public_backend {
    server 127.0.0.1:8811;
    keepalive 1024;
}

# Managed by StreamForge. Runtime listeners are regenerated from Main/Local access URLs.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1g;
    proxy_connect_timeout 15s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # STREAMFORGE_MAIN_PANEL_GZIP_V1115: compress finite Panel HTML/JSON/CSS/JS
    # over WAN links; HLS media types are intentionally not listed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # STREAMFORGE_MANAGED_ACME_WEBROOT_V37
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/streamforge/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    # STREAMFORGE_MAIN_HLS_XACCEL_LOCATION_V63: internal-only HLS body fast path.
    location ^~ /_streamforge_hls/ {
        internal;
        alias /var/lib/streamforge/hls/;
        sendfile on;
        tcp_nopush on;
        types {
            video/mp2t ts;
            video/iso.segment m4s;
            audio/aac aac;
            audio/mpeg mp3;
            application/octet-stream key;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-StreamForge-Media-Path "nginx-x-accel" always;
    }

    # STREAMFORGE_NGINX_RELAY_FASTPATH_V60: signed Local-Node relay bypasses Gunicorn.
    location ~ "^/relay/[0-9a-f]{32}/[A-Za-z0-9_-]+/(?:index\.m3u8|[A-Za-z0-9_.-]+\.(?:ts|m4s|aac|mp3|key))$" {
        root /var/lib/streamforge;
        sendfile on;
        tcp_nopush on;
        # STREAMFORGE_RELAY_MISS_PUBLIC_FALLBACK_V111: a transient missing
        # symlink/playlist must not become an immediate 404 to Node FFmpeg.
        # Direct hits remain zero-Python; misses are validated/read by FastAPI.
        try_files $uri @streamforge_relay_fallback;
        access_log /var/log/nginx/access.log combined if=$streamforge_relay_access_loggable;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            audio/aac aac;
            audio/mpeg mp3;
            application/octet-stream key;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-StreamForge-Relay "nginx-direct" always;
    }


    # STREAMFORGE_RELAY_MISS_PUBLIC_FALLBACK_V111: only relay filesystem misses
    # reach the Public plane. The original URI is preserved and the FastAPI
    # relay endpoint returns 503 while a live playlist is temporarily absent.
    location @streamforge_relay_fallback {
        proxy_pass http://streamforge_public_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $streamforge_forwarded_host;
        proxy_set_header X-Forwarded-Port $streamforge_forwarded_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $streamforge_forwarded_proto;
        proxy_set_header X-StreamForge-Internal-Relay-Fallback 1;
        proxy_set_header Connection "";
    }

    # STREAMFORGE_PUBLIC_PLANE_NGINX_SPLIT_V62
    # STREAMFORGE_MAIN_SHARED_ASSETS_PUBLIC_PLANE_V1055
    location ~ "^/(?:[A-Za-z0-9_-]+/)?(?:web-player(?:/|$)|player(?:/|$)|watch(?:/|$)|playlist(?:/|$)|play(?:/|$)|live(?:/|$)|ek(?:/|$)|relay(?:/|$)|channel-logos(?:/|$)|node-logos(?:/|$)|branding-assets(?:/|$)|get\.php$|player_api\.php$|update\.json$|[^/]+\.apk$)" {
        # STREAMFORGE_MAIN_ALIAS_LOGO_CANONICAL_UPSTREAM_V1057
        rewrite ^/[A-Za-z0-9_-]+(/channel-logos/[A-Za-z0-9._-]+)$ $1 break;
        proxy_pass http://streamforge_public_backend;
        proxy_intercept_errors on;
        error_page 404 418 = @streamforge_silent_drop;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $streamforge_forwarded_host;
        proxy_set_header X-Forwarded-Port $streamforge_forwarded_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $streamforge_forwarded_proto;
        proxy_set_header X-StreamForge-Internal-Relay-Fallback "";
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://streamforge_main_backend;
        # STREAMFORGE_FRESH_UNKNOWN_PATH_SILENT_DROP_V3014:
        # Hide framework 404 responses even before runtime access policy is
        # generated on a new installation.
        proxy_intercept_errors on;
        error_page 404 418 = @streamforge_silent_drop;
        proxy_http_version 1.1;
        # STREAMFORGE_MAIN_PANEL_RESPONSE_BUFFERING_V1115: finite Panel responses
        # are drained from the single Gunicorn worker into Nginx immediately.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        # STREAMFORGE_CHAINED_PROXY_PROTOCOL_V35: preserve public TLS/proxy headers when present.
        proxy_set_header X-Forwarded-Host $streamforge_forwarded_host;
        proxy_set_header X-Forwarded-Port $streamforge_forwarded_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $streamforge_forwarded_proto;
        proxy_set_header Connection "";
    }

    location @streamforge_silent_drop {
        return 444;
    }
}
