name: v12.81 Live Node Panel Charts
on:
  pull_request:
    paths:
      - VERSION
      - node_agent/**
      - scripts/force_update_v1281.sh
      - scripts/test_v1281_*.py
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - .github/workflows/v1281-node-live-charts.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install runtime dependencies
        run: python3 -m pip install -q -r requirements.txt httpx
      - name: Node Panel live chart contract
        shell: bash
        run: |
          python3 scripts/test_v1281_node_live_charts.py > test.log 2>&1 && cat test.log || {
            tail -9 test.log | tac | while IFS= read -r line; do echo "::error title=test_v1281_node_live_charts.py::$line"; done
            exit 1
          }
      - name: Node Panel headers and login unchanged
        run: |
          python3 scripts/test_v1277_node_headers.py
          python3 scripts/test_v1272_node_login.py
      - name: Test staged update and rollback
        shell: bash
        run: |
          python3 scripts/test_v1281_updater.py > test.log 2>&1 && cat test.log || {
            tail -9 test.log | tac | while IFS= read -r line; do echo "::error title=test_v1281_updater.py::$line"; done
            exit 1
          }
      - name: Verify release staging and safe restart scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1281.sh
          bash -n scripts/update.sh
          if [[ "$(cat VERSION)" == "12.81" ]]; then
            grep -Fq 'force_update_v1281.sh' scripts/update.sh
            test "$(cat node_agent/VERSION)" = "12.81"
          fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+(nginx|streamforge-channel-supervisor)' scripts/force_update_v1281.sh; then exit 1; fi
          grep -Fq 'streamforge-update --force /root/streamforge-12.81.zip' release-notes/v12.81.md
          grep -Fq 'Node Updates' release-notes/v12.81.md
          git diff --check
