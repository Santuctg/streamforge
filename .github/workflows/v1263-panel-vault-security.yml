name: v12.63 Panel Vault and Login Security
on:
  push:
    branches: [security/v12.63-panel-vault-login-guard]
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/main.py
      - app/models.py
      - app/db.py
      - app/panel_password_security.py
      - app/templates/admin_users.html
      - scripts/test_v1263_security.py
      - scripts/force_update_v1263.sh
      - scripts/test_v1263_updater_integration.py
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.63.md
      - .github/workflows/v1263-panel-vault-security.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption test dependency
        run: python3 -m pip install cryptography --quiet
      - name: Run vault, rate-limit and injection regression
        run: PYTHONPATH=. python3 scripts/test_v1263_security.py
