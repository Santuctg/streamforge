name: v12.63 Panel Vault and Login Security
on:
  push:
    branches: [security/v12.63-panel-vault-login-guard]
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/main.py
      - app/models.py
      - app/db.py
      - app/panel_password_security.py
      - app/templates/admin_users.html
      - scripts/test_v1263_security.py
      - scripts/force_update_v1263.sh
      - scripts/test_v1263_updater_integration.py
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.63.md
      - .github/workflows/v1263-panel-vault-security.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption test dependency
        run: python3 -m pip install cryptography --quiet
      - name: Run vault, rate-limit and injection regression
        run: PYTHONPATH=. python3 scripts/test_v1263_security.py
      - name: Check bounded updater install and rollback
        run: PYTHONPATH=. python3 scripts/test_v1263_updater_integration.py
      - name: Verify Python and shell syntax
        run: |
          bash -n scripts/force_update_v1263.sh
          bash -n scripts/update.sh
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app/panel_password_security.py','app/models.py','app/db.py','app/main.py','scripts/test_v1263_security.py','scripts/test_v1263_updater_integration.py'):
              compile(Path(name).read_text(),name,'exec')
          print('PASS: bounded Python and Bash syntax')
          PY
      - name: Verify current bounded release staging
        run: python3 scripts/verify_release_updater_staging.py
      - name: Verify hardening boundaries and earlier release features
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'force_update_v1263.sh' scripts/update.sh
          grep -Fq 'STREAMFORGE_V1263_MAIN_SECURITY_NODE_RUNTIME_ALIGNMENT' scripts/force_update_v1263.sh
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_LINK_FIX_V1262' app/templates/admin_user_form.html
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_VISIBILITY_V1261' app/templates/admin_user_form.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
          grep -Fq 'STREAMFORGE_NODE_UPDATE_UI_SPACING_V1259' app/templates/node_updates.html
          python3 scripts/verify_node_bulk_update_center_v1257.py
          python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1263.sh; then exit 1; fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1263.sh; then exit 1; fi
      - name: Verify v12.63 release notes
        run: |
          test -s release-notes/v12.63.md
          grep -Fq 'Back up this key' release-notes/v12.63.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.63.zip' release-notes/v12.63.md
