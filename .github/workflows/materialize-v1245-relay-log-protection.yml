name: Materialize v12.45 relay log protection

on:
  push:
    branches:
      - hotfix/v12.45-relay-log-protection

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize product and release changes
        run: python3 scripts/materialize_v1245_relay_log_protection.py
      - name: Verify relay log protection
        run: python3 scripts/verify_relay_log_protection_v1245.py
      - name: Verify syntax
        run: |
          bash -n scripts/force_update_v1245.sh
          bash -n scripts/update.sh
          python3 -m py_compile scripts/apply_main_access.py scripts/verify_relay_log_protection_v1245.py
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/release-sanity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/nginx.conf scripts/apply_main_access.py VERSION node_agent/VERSION scripts/force_update_v1245.sh scripts/update.sh release-notes/v12.45.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'hotfix: bound relay logging and nginx log rotation'
          git push origin HEAD:hotfix/v12.45-relay-log-protection
