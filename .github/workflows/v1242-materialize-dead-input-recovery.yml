name: v12.42 Materialize Dead Input Recovery

on:
  push:
    branches:
      - hotfix/v12.42-dead-input-recovery

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v12.42-dead-input-recovery
          fetch-depth: 0
      - name: Apply v12.42 source patch
        run: python3 scripts/apply_v1242_dead_input_recovery.py .
      - name: Verify source guard
        run: python3 scripts/verify_dead_input_recovery_interval_v1242.py
      - name: Compile changed Python
        run: python3 -m py_compile app/models.py app/db.py app/main.py app/ffmpeg.py scripts/apply_v1242_dead_input_recovery.py scripts/verify_dead_input_recovery_interval_v1242.py
      - name: Commit materialized source
        run: |
          if git diff --quiet; then
            echo 'Source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/models.py app/db.py app/main.py app/ffmpeg.py app/templates/channel_form.html
          git commit -m 'feat: materialize v12.42 per-channel dead-input recovery interval'
          git push origin HEAD:hotfix/v12.42-dead-input-recovery
