name: v12.57 Source Integration

on:
  push:
    branches:
      - feature/v12.57-node-bulk-update-center
    paths:
      - 'scripts/apply_v1257_node_bulk_update_center.py'
      - 'app/templates/node_updates.html'
      - '.github/workflows/v1257-source-integration.yml'

permissions:
  contents: write

concurrency:
  group: v1257-source-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify v12.57 source
        run: |
          set -euo pipefail
          python3 scripts/apply_v1257_node_bulk_update_center.py
          python3 scripts/verify_node_bulk_update_center_v1257.py
          python3 -c "from pathlib import Path; compile(Path('app/main.py').read_text(), 'app/main.py', 'exec')"
      - name: Commit integrated source
        run: |
          set -euo pipefail
          if git diff --quiet -- app/main.py app/templates/base.html app/templates/nodes.html; then
            echo 'v12.57 source is already integrated.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/templates/base.html app/templates/nodes.html
          git commit -m "Integrate v12.57 Node bulk update center source"
          git push origin HEAD:feature/v12.57-node-bulk-update-center
