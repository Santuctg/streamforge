name: v12.62 Panel User Password Link Fix
on:
  push:
    branches: [hotfix/v12.62-password-navigation]
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_password_navigation_v1262.py
      - scripts/test_v1262_updater_integration.py
      - scripts/force_update_v1262.sh
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.62.md
      - .github/workflows/v1262-password-navigation.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hidden-route password link
        run: python3 scripts/verify_password_navigation_v1262.py
      - name: Verify v12.62 bounded install/reinstall/rollback
        run: python3 scripts/test_v1262_updater_integration.py
      - name: Verify current updater staging and service boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          grep -Fq 'force_update_v1262.sh' scripts/update.sh
          grep -Fq 'STREAMFORGE_V1262_MAIN_UI_ONLY_NODE_VERSION_ALIGNMENT' scripts/force_update_v1262.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1262.sh; then exit 1; fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1262.sh; then exit 1; fi
          bash -n scripts/force_update_v1262.sh
          bash -n scripts/update.sh
      - name: Verify prior browser and Node guards
        run: |
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_VISIBILITY_V1261' app/templates/admin_user_form.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
          python3 scripts/verify_node_bulk_update_center_v1257.py
          python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
      - name: Verify release notes
        run: |
          test -s release-notes/v12.62.md
          grep -Fq 'Change password' release-notes/v12.62.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.62.zip' release-notes/v12.62.md
