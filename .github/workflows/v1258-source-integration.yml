name: v12.58 Source Integration

on:
  push:
    branches:
      - hotfix/v12.58-node-update-center-cleanup
    paths:
      - scripts/apply_v1258_node_update_center_cleanup.py
      - app/templates/node_updates.html
      - .github/workflows/v1258-source-integration.yml

permissions:
  contents: write

concurrency:
  group: v1258-source-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify v12.58 source
        run: |
          set -euo pipefail
          python3 scripts/apply_v1258_node_update_center_cleanup.py
          python3 scripts/verify_node_update_center_cleanup_v1258.py
          python3 -c "from pathlib import Path; compile(Path('app/main.py').read_text(), 'app/main.py', 'exec')"
      - name: Commit integrated source
        run: |
          set -euo pipefail
          if git diff --quiet -- VERSION node_agent/VERSION app/main.py; then
            echo 'v12.58 source is already integrated.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION node_agent/VERSION app/main.py
          git commit -m "Integrate v12.58 Node Update Center cleanup source"
          git push origin HEAD:hotfix/v12.58-node-update-center-cleanup
