name: v12.60 Inline Node Update Log

on:
  push:
    branches:
      - hotfix/v12.60-inline-node-update-log
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/node_updates.html
      - scripts/verify_node_inline_update_log_v1260.py
      - scripts/test_v1260_updater_integration.py
      - scripts/force_update_v1260.sh
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.60.md
      - .github/workflows/v1260-inline-node-update-log.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.60 inline Node update log
        run: python3 scripts/verify_node_inline_update_log_v1260.py
