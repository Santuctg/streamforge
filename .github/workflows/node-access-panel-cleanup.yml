name: Node access panel cleanup

on:
  push:
    branches:
      - fix/node-access-panel-cleanup
  pull_request:
    paths:
      - node_agent/app.py
      - app/templates/node_form.html
      - scripts/apply_node_access_panel_cleanup.py
      - scripts/verify_node_access_panel_cleanup.py
      - .github/workflows/node-access-panel-cleanup.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/node-access-panel-cleanup
      - name: Apply deterministic Node Access Panel cleanup
        run: python3 scripts/apply_node_access_panel_cleanup.py
      - name: Verify Python syntax
        run: python3 -m py_compile node_agent/app.py
      - name: Run Node Access Panel cleanup guard
        run: python3 scripts/verify_node_access_panel_cleanup.py
      - name: Check for stale Node settings form reads
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "f.get('panel_urls')" node_agent/app.py
          ! grep -Fq "f.get('stream_urls')" node_agent/app.py
          ! grep -Fq "f.get('panel_ip_whitelist')" node_agent/app.py
          ! grep -Fq "f.get('ip_whitelist')" node_agent/app.py
      - name: Commit generated Node Agent source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- node_agent/app.py; then
            echo "Node Agent source already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add node_agent/app.py
          git commit -m "fix: remove access controls from Node settings panel"
          git push origin HEAD:fix/node-access-panel-cleanup
