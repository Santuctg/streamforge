name: v12.58 Node Update Center Cleanup

on:
  push:
    branches:
      - hotfix/v12.58-node-update-center-cleanup
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/main.py
      - app/templates/node_updates.html
      - scripts/apply_v1258_node_update_center_cleanup.py
      - scripts/verify_node_update_center_cleanup_v1258.py
      - scripts/test_v1258_updater_integration.py
      - scripts/force_update_v1258.sh
      - .github/workflows/v1258-node-update-center-cleanup.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.58 Node Update Center cleanup
        run: python3 scripts/verify_node_update_center_cleanup_v1258.py
      - name: Verify v12.58 updater integration
        run: python3 scripts/test_v1258_updater_integration.py
      - name: Verify carry-forward guards
        run: |
          python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
          python3 scripts/verify_main_waiting_retry_v1253.py .
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
          grep -Fq 'STREAMFORGE_NODE_BULK_UPDATE_CENTER_V1257' app/main.py
          grep -Fq 'STREAMFORGE_LOCAL_RELAY_DB_CLOSE_V1250' app/main.py
      - name: Verify Python syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ('app/main.py','scripts/apply_v1258_node_update_center_cleanup.py','scripts/verify_node_update_center_cleanup_v1258.py','scripts/test_v1258_updater_integration.py'):
              compile(Path(rel).read_text(encoding='utf-8'), rel, 'exec')
          print('PASS: v12.58 Python syntax verified without bytecode output')
          PY
      - name: Verify updater shell syntax
        run: bash -n scripts/force_update_v1258.sh
