name: v12.63 Vault Contract
on:
  push:
    branches:
      - feature/v12.63-panel-credential-vault
  pull_request:
    paths:
      - VERSION
      - app/panel_password_vault.py
      - app/permissions.py
      - scripts/apply_v1263_vault.py
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_panel_credential_vault_v1263.py
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Check bounded Main patch
        run: python3 scripts/test_v1263_vault_patch.py
      - name: Prepare Python test dependencies
        run: python3 -m pip install fastapi sqlalchemy cryptography python-multipart httpx itsdangerous
      - name: Execute isolated vault tests
        run: PYTHONPATH=. python3 scripts/test_v1263_vault_security.py
      - name: Test v12.63 scoped updater
        run: python3 scripts/test_v1263_updater_integration.py
      - name: Verify scoped release packaging guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1263.sh
          bash -n scripts/update.sh
          grep -Fq 'force_update_v1263.sh' scripts/update.sh
          grep -Fq 'STREAMFORGE_V1263_MAIN_UI_ONLY_NODE_VERSION_ALIGNMENT' scripts/force_update_v1263.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1263.sh; then exit 1; fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1263.sh; then exit 1; fi
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_LINK_FIX_V1262' app/templates/admin_users.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
      - name: Verify release notes
        run: |
          test -s release-notes/v12.63.md
          grep -Fq 'encrypted vault' release-notes/v12.63.md
          grep -Fq 'STREAMFORGE_PANEL_PASSWORD_VAULT_KEY' release-notes/v12.63.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.63.zip' release-notes/v12.63.md
