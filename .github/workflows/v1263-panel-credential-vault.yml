name: v12.66 Auto Managed Password Vault
on:
  push:
    branches:
      - feature/v12.66-auto-panel-password-vault
  pull_request:
    paths:
      - VERSION
      - app/panel_password_vault.py
      - app/panel_login_guard.py
      - scripts/test_v1266_auto_vault.py
      - scripts/apply_v1266_auto_vault.py
      - scripts/force_update_v1266.sh
      - app/permissions.py
      - scripts/apply_v1263_vault.py
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_panel_credential_vault_v1263.py
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Check Main and Node automatic vault and explicit notice
        run: python3 scripts/test_v1266_auto_vault.py
      - name: Prepare Python test dependencies
        run: python3 -m pip install fastapi sqlalchemy cryptography python-multipart httpx itsdangerous
      - name: Execute isolated vault tests
        run: PYTHONPATH=. python3 scripts/test_v1263_vault_security.py
      - name: Test IP throttling and proxy source handling
        run: PYTHONPATH=. python3 scripts/test_v1265_ip_origin.py
      - name: Test scoped Main/Node updater and rollback
        run: python3 scripts/test_v1266_updater.py
      - name: Verify scoped release packaging guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1266.sh
          bash -n scripts/update.sh
          grep -Fq 'force_update_v1266.sh' scripts/update.sh
          grep -Fq 'STREAMFORGE_V1266_NODE_SOURCE_PARITY' scripts/force_update_v1266.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1266.sh; then exit 1; fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1266.sh; then exit 1; fi
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_LINK_FIX_V1262' app/templates/admin_users.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
      - name: Verify release notes
        run: |
          test -s release-notes/v12.66.md
          grep -Fq 'IP' release-notes/v12.66.md
          grep -Fq 'managed Panel passwords' release-notes/v12.66.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.66.zip' release-notes/v12.66.md
