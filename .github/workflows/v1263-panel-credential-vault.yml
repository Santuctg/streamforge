name: v12.64 Panel IP Guard
on:
  push:
    branches:
      - feature/v12.64-panel-ip-lockout
  pull_request:
    paths:
      - VERSION
      - app/panel_password_vault.py
      - app/panel_login_guard.py
      - scripts/test_v1264_ip_guard.py
      - scripts/apply_v1264_ip_lock.py
      - scripts/force_update_v1264.sh
      - app/permissions.py
      - scripts/apply_v1263_vault.py
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_panel_credential_vault_v1263.py
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Check bounded Main and Node IP guard patch
        run: python3 scripts/test_v1264_ip_patch.py
      - name: Prepare Python test dependencies
        run: python3 -m pip install fastapi sqlalchemy cryptography python-multipart httpx itsdangerous
      - name: Execute isolated vault tests
        run: PYTHONPATH=. python3 scripts/test_v1263_vault_security.py
      - name: Test durable three-hour IP policy and proxy source selection
        run: PYTHONPATH=. python3 scripts/test_v1264_ip_guard.py
      - name: Test scoped v12.64 update and rollback
        run: python3 scripts/test_v1264_updater.py
      - name: Verify scoped release packaging guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1264.sh
          bash -n scripts/update.sh
          grep -Fq 'force_update_v1264.sh' scripts/update.sh
          grep -Fq 'STREAMFORGE_V1264_MAIN_ONLY_IP_LOCK_NODE_PARITY' scripts/force_update_v1264.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1264.sh; then exit 1; fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1264.sh; then exit 1; fi
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_LINK_FIX_V1262' app/templates/admin_users.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
      - name: Verify release notes
        run: |
          test -s release-notes/v12.64.md
          grep -Fq 'IP' release-notes/v12.64.md
          grep -Fq 'STREAMFORGE_PANEL_PASSWORD_VAULT_KEY' release-notes/v12.64.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.64.zip' release-notes/v12.64.md
