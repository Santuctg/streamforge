name: v12.43 schema-order guard

on:
  push:
    branches:
      - hotfix/v12.43-schema-order
  pull_request:
    paths:
      - scripts/force_update_v1243.sh
      - scripts/verify_v1243_schema_order.py
      - .github/workflows/v1243-schema-order.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration ordering regression
        run: python3 scripts/verify_v1243_schema_order.py
