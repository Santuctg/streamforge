name: v12.47 relay log-volume protection

on:
  push:
    paths:
      - VERSION
      - node_agent/VERSION
      - deploy/nginx.conf
      - scripts/apply_main_access.py
      - scripts/fetch_hlsjs.sh
      - scripts/force_update_v1247.sh
      - scripts/verify_relay_log_volume_v1247.py
      - .github/workflows/v1247-relay-log-volume.yml
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - deploy/nginx.conf
      - scripts/apply_main_access.py
      - scripts/fetch_hlsjs.sh
      - scripts/force_update_v1247.sh
      - scripts/verify_relay_log_volume_v1247.py
      - .github/workflows/v1247-relay-log-volume.yml

permissions:
  contents: read

jobs:
  relay-log-volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay log-volume policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(tr -d '[:space:]' < VERSION)" != "12.47" ]]; then
            echo "Skipping historical v12.47 check for VERSION $(tr -d '[:space:]' < VERSION)"
            exit 0
          fi
          python3 scripts/verify_relay_log_volume_v1247.py
