name: Materialize v12.44 dashboard datetime

on:
  push:
    branches:
      - feature/v12.44-dashboard-datetime

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize product changes
        run: python3 scripts/materialize_v1244_dashboard_datetime.py
      - name: Verify parity guard
        run: python3 scripts/verify_dashboard_datetime_parity_v1244.py
      - name: Verify Python syntax
        run: python3 -m py_compile node_agent/app.py
      - name: Commit materialized product files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/static/dashboard.js node_agent/app.py; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/dashboard.js node_agent/app.py
          git commit -m 'feat: add adaptive dashboard date and time labels'
          git push origin HEAD:feature/v12.44-dashboard-datetime
