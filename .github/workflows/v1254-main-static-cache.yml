name: V12.54 Main Static Cache Sync

on:
  pull_request:
    paths:
      - scripts/sync_main_static_cache.py
      - scripts/test_main_static_cache_sync_v1254.py
      - scripts/force_update_v1254.sh
      - .github/workflows/v1254-main-static-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.54 Main static cache sync
        run: python3 scripts/test_main_static_cache_sync_v1254.py
