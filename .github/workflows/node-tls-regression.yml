name: Node TLS regression

on:
  push:
    branches:
      - fix/node-tls-persistent-request
  pull_request:
    paths:
      - 'node_agent/apply_node_tls.py'
      - 'scripts/install_node_agent.sh'
      - 'scripts/apply_node_tls_reconcile_fix.py'
      - 'scripts/verify_node_tls_reconcile_fix.py'
      - '.github/workflows/node-tls-regression.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic TLS reconcile fix
        run: python3 scripts/apply_node_tls_reconcile_fix.py
      - name: Verify TLS reconcile invariants
        run: python3 scripts/verify_node_tls_reconcile_fix.py
      - name: Syntax check TLS helper
        run: python3 -m py_compile node_agent/apply_node_tls.py
      - name: Check diff
        run: git diff --check
      - name: Commit generated patch on branch push
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "streamforge-ci"
          git config user.email "streamforge-ci@users.noreply.github.com"
          git add node_agent/apply_node_tls.py scripts/install_node_agent.sh
          git commit -m "fix: keep Node TLS reconcile request persistent"
          git push
