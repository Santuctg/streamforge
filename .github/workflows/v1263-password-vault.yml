name: v12.63 Encrypted Panel User Password Vault
on:
  push:
    branches: [feature/v12.63-panel-password-vault]
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/main.py
      - app/models.py
      - app/db.py
      - app/panel_password_vault.py
      - app/templates/admin_users.html
      - scripts/verify_panel_saved_password_v1263.py
      - .github/workflows/v1263-password-vault.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.63 saved password vault
        run: python3 scripts/verify_panel_saved_password_v1263.py
