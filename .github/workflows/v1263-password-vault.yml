name: v12.63 Encrypted Panel User Password Vault
on:
  push:
    branches: [feature/v12.63-panel-password-vault]
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/main.py
      - app/models.py
      - app/db.py
      - app/panel_password_vault.py
      - app/templates/admin_users.html
      - scripts/test_v1263_updater_integration.py
      - scripts/test_v1263_vault_crypto.py
      - scripts/test_v1263_vault_handler.py
      - scripts/force_update_v1263.sh
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.63.md
      - .github/workflows/v1262-password-navigation.yml
      - scripts/verify_panel_saved_password_v1263.py
      - .github/workflows/v1263-password-vault.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.63 saved password vault
        run: python3 scripts/verify_panel_saved_password_v1263.py
      - name: Verify v12.63 bounded installer integration
        run: python3 scripts/test_v1263_updater_integration.py
      - name: Verify backend auth, origin, re-auth and disclosure limits
        run: python3 scripts/test_v1263_vault_handler.py
      - name: Test production Fernet encryption and key handling
        run: |
          python3 -m pip install 'cryptography>=40'
          python3 scripts/test_v1263_vault_crypto.py
      - name: Verify release staging and updater selection
        run: |
          python3 scripts/verify_release_updater_staging.py
          grep -Fq 'force_update_v1263.sh' scripts/update.sh
          bash -n scripts/force_update_v1263.sh
          bash -n scripts/update.sh
      - name: Verify safe service boundaries and syntax
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1263.sh; then
            echo 'Cannot restart channel supervisor during password vault installation' >&2
            exit 1
          fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1263.sh; then
            echo 'Cannot restart nginx during password vault installation' >&2
            exit 1
          fi
          grep -Fq 'STREAMFORGE_V1263_SECRET_PREFLIGHT' scripts/force_update_v1263.sh
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_LINK_FIX_V1262' app/templates/admin_users.html
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_VISIBILITY_V1261' app/templates/admin_user_form.html
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
          grep -Fq 'STREAMFORGE_LOCAL_RELAY_DB_CLOSE_V1250' app/main.py
          python3 scripts/verify_node_bulk_update_center_v1257.py
          python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
          bash -n scripts/force_update_v1263.sh
          bash -n scripts/update.sh
      - name: Verify v12.63 release notes
        shell: bash
        run: |
          test -s release-notes/v12.63.md
          grep -Fq 'Super Admin' release-notes/v12.63.md
          grep -Fq 'STREAMFORGE_SECRET_KEY' release-notes/v12.63.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.63.zip' release-notes/v12.63.md
      - name: Verify Python syntax without generating bytecode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ('app/main.py','app/models.py','app/db.py','app/panel_password_vault.py',
                      'scripts/verify_panel_saved_password_v1263.py',
                      'scripts/test_v1263_updater_integration.py','scripts/test_v1263_vault_handler.py',
                      'scripts/test_v1263_vault_crypto.py','scripts/verify_release_updater_staging.py'):
              compile(Path(rel).read_text(encoding='utf-8'), rel, 'exec')
          print('PASS: v12.63 source syntax without __pycache__')
          PY
