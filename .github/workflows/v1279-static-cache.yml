name: v12.79 Static Cache Refresh
on:
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/static/**
      - scripts/sync_main_static_cache.py
      - scripts/force_update_v1279.sh
      - scripts/test_v1279_*.py
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - .github/workflows/v1279-static-cache.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test static cache refresh, rollback and gates
        shell: bash
        run: |
          python3 scripts/test_v1279_updater.py > test.log 2>&1 && cat test.log || {
            tail -9 test.log | tac | while IFS= read -r line; do echo "::error title=test_v1279_updater.py::$line"; done
            exit 1
          }
      - name: Verify release staging and safe restart scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1279.sh
          bash -n scripts/update.sh
          if [[ "$(cat VERSION)" == "12.79" ]]; then
            grep -Fq 'force_update_v1279.sh' scripts/update.sh
            test "$(cat node_agent/VERSION)" = "12.79"
          fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+(nginx|streamforge-channel-supervisor)' scripts/force_update_v1279.sh; then exit 1; fi
          grep -Fq 'streamforge-update --force /root/streamforge-12.79.zip' release-notes/v12.79.md
          git diff --check
