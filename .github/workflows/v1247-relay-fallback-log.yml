name: v12.47 relay fallback log guard

on:
  push:
    branches:
      - hotfix/v12.47-relay-fallback-log
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay fallback logging protection
        run: python3 scripts/verify_v1247_relay_fallback_log.py
