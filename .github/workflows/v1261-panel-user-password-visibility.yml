name: v12.61 Panel User Password Visibility

on:
  push:
    branches:
      - hotfix/v12.61-panel-user-password-toggle
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_panel_user_password_visibility_v1261.py
      - scripts/test_v1261_updater_integration.py
      - scripts/test_v1261_password_visibility_client.js
      - scripts/force_update_v1261.sh
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.61.md
      - .github/workflows/v1261-panel-user-password-visibility.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.61 carry-forward or exact-version tests
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_VISIBILITY_V1261' app/templates/admin_user_form.html
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.61" ]]; then
            python3 scripts/verify_panel_user_password_visibility_v1261.py
            node scripts/test_v1261_password_visibility_client.js
            python3 scripts/test_v1261_updater_integration.py
          else
            echo 'Historical v12.61 exact-version tests skipped for later release.'
          fi
      - name: Verify current release staging contract
        run: python3 scripts/verify_release_updater_staging.py
      - name: Verify packaging and service boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.61" ]]; then
            grep -Fq 'force_update_v1261.sh' scripts/update.sh
          else
            echo 'Historical updater selection skipped for later release.'
          fi
          grep -Fq 'STREAMFORGE_PANEL_USER_PASSWORD_VISIBILITY_V1261' app/templates/admin_user_form.html
          grep -Fq 'STREAMFORGE_V1261_MAIN_UI_ONLY_NODE_VERSION_ALIGNMENT' scripts/force_update_v1261.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+streamforge-channel-supervisor' scripts/force_update_v1261.sh; then
            echo 'v12.61 must not restart Main channel supervisor' >&2
            exit 1
          fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+nginx' scripts/force_update_v1261.sh; then
            echo 'v12.61 must not restart or reload Nginx' >&2
            exit 1
          fi
      - name: Verify v12.60 and earlier protections
        run: |
          grep -Fq 'STREAMFORGE_NODE_INLINE_UPDATE_LOG_V1260' app/templates/node_updates.html
          grep -Fq 'STREAMFORGE_NODE_UPDATE_UI_SPACING_V1259' app/templates/node_updates.html
          grep -Fq 'STREAMFORGE_NODE_UPDATE_CENTER_CLEANUP_V1258' app/main.py
          python3 scripts/verify_node_bulk_update_center_v1257.py
          python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
      - name: Verify v12.61 release notes
        run: |
          test -s release-notes/v12.61.md
          grep -Fq 'Change password' release-notes/v12.61.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.61.zip' release-notes/v12.61.md
      - name: Verify updater shell and Python syntax without bytecode
        run: |
          bash -n scripts/force_update_v1261.sh
          bash -n scripts/update.sh
          python3 - <<'PY'
          from pathlib import Path
          for rel in ('scripts/verify_panel_user_password_visibility_v1261.py','scripts/test_v1261_updater_integration.py','scripts/verify_release_updater_staging.py'):
              compile(Path(rel).read_text(encoding='utf-8'), rel, 'exec')
          print('PASS: v12.61 verifier syntax')
          PY
