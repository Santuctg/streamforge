name: v12.61 Panel User Password Visibility

on:
  push:
    branches:
      - hotfix/v12.61-panel-user-password-toggle
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/admin_users.html
      - app/templates/admin_user_form.html
      - scripts/verify_panel_user_password_visibility_v1261.py
      - scripts/test_v1261_updater_integration.py
      - scripts/test_v1261_password_visibility_client.js
      - scripts/force_update_v1261.sh
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - release-notes/v12.61.md
      - .github/workflows/v1261-panel-user-password-visibility.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.61 client-only show/hide/reset contract
        run: python3 scripts/verify_panel_user_password_visibility_v1261.py
      - name: Verify browser Show/Hide client behavior
        run: node scripts/test_v1261_password_visibility_client.js
      - name: Verify v12.61 updater integration
        run: python3 scripts/test_v1261_updater_integration.py
