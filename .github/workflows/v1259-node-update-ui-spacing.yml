name: v12.59 Node Update Center UI Spacing

on:
  push:
    branches:
      - hotfix/v12.59-node-update-ui-spacing
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/node_updates.html
      - scripts/verify_node_update_ui_spacing_v1259.py
      - scripts/force_update_v1259.sh
      - scripts/update.sh
      - release-notes/v12.59.md
      - .github/workflows/v1259-node-update-ui-spacing.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v12.59 Node Update Center UI spacing
        run: python3 scripts/verify_node_update_ui_spacing_v1259.py
