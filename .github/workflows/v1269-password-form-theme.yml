name: v12.69 Saved Password Dark Theme and Node Form
on:
  push:
    branches:
      - fix/v12.69-vault-reveal-theme-node-notice
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - node_agent/app.py
      - app/templates/admin_users.html
      - scripts/force_update_v1269.sh
      - scripts/test_v1269_password_ui.py
      - scripts/test_v1269_updater.py
      - scripts/verify_panel_credential_vault_v1263.py
      - scripts/verify_release_updater_staging.py
      - .github/workflows/v1269-password-form-theme.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check input type-toggle and compact Node page
        run: |
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.69" ]]; then
            python3 scripts/test_v1269_password_ui.py
          else
            python3 scripts/test_v1270_reveal_ui.py
          fi
      - name: Install test dependencies
        run: python3 -m pip install fastapi sqlalchemy cryptography python-multipart httpx itsdangerous
      - name: Verify existing vault, IP security, and Node disclosure contracts
        run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Run isolated existing saved-password security suite
        run: PYTHONPATH=. python3 scripts/test_v1263_vault_security.py
      - name: Verify existing Main password reset API
        run: PYTHONPATH=. python3 scripts/test_v1268_password_modal.py
      - name: Test v12.69 bounded update and rollback
        run: |
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.69" ]]; then
            python3 scripts/test_v1269_updater.py
          else
            echo 'Historical v12.69 updater test skipped for later versions.'
          fi
      - name: Verify scoped updater boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1269.sh
          bash -n scripts/update.sh
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.69" ]]; then
            grep -Fq 'force_update_v1269.sh' scripts/update.sh
          else
            echo 'Historical v12.69 updater selection skipped; current release verifies its own updater.'
          fi
          grep -Fq 'STREAMFORGE_V1269_NODE_FORM_ONLY_PARITY' scripts/force_update_v1269.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+(nginx|streamforge-channel-supervisor)' scripts/force_update_v1269.sh; then exit 1; fi
          git diff --check
      - name: Release notes
        run: |
          test -s release-notes/v12.69.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.69.zip' release-notes/v12.69.md
