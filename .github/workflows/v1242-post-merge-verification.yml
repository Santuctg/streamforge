name: v12.42 Post-Merge Verification

on:
  push:
    branches:
      - verify/v12.42-post-merge

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: 8e4f87bd912ebfb9a44530efb8fc3502c32b2018

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify source wiring
        run: python3 scripts/verify_dead_input_recovery_interval_v1242.py

      - name: Verify recovery policy and 30-minute default
        run: |
          python3 scripts/verify_dead_input_recovery_policy_v1242.py
          python3 - <<'PY'
          from app.recovery_policy import (
              dead_input_cycle_exhausted,
              dead_input_recovery_minutes,
              dead_input_recovery_seconds,
          )

          assert dead_input_recovery_minutes(None) == 30
          assert dead_input_recovery_seconds(None) == 1800
          for value in (5, 10, 15, 30, 60):
              assert dead_input_recovery_minutes(value) == value
              assert dead_input_recovery_seconds(value) == value * 60

          assert dead_input_cycle_exhausted(1, 3) is False
          assert dead_input_cycle_exhausted(2, 3) is False
          assert dead_input_cycle_exhausted(3, 3) is True
          assert dead_input_cycle_exhausted(1, 1) is True
          print('OK: default=30 minutes, presets convert correctly, full-cycle threshold correct')
          PY

      - name: Verify scheduler wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/ffmpeg.py').read_text(encoding='utf-8')
          required = {
              'configured interval used for long delay': 'dead_input_recovery_seconds(configured_recovery)',
              'short backoff retained before cycle exhaustion': 'else self._restart_delay(attempt)',
              'consecutive failure counter reset after full cycle': 'self._restart_attempts[channel_id] = 0 if full_cycle_exhausted else attempt',
              'new cycle resets to primary input': 'channel.active_input_index = 0',
              'all inputs counted': 'source_count = max(1, len(self.input_urls(channel)))',
          }
          missing = [name for name, marker in required.items() if marker not in text]
          for name in required:
              print(('FAIL' if name in missing else 'OK') + ': ' + name)
          if missing:
              raise SystemExit('Missing scheduler behavior: ' + ', '.join(missing))
          PY

      - name: Verify additive SQLite migration and default
        env:
          STREAMFORGE_DATABASE_URL: sqlite:////tmp/streamforge-v1242-migration.db
        run: |
          rm -f /tmp/streamforge-v1242-migration.db
          python3 - <<'PY'
          import sqlite3

          path = '/tmp/streamforge-v1242-migration.db'
          conn = sqlite3.connect(path)
          conn.executescript('''
          CREATE TABLE channel_categories (
              id INTEGER PRIMARY KEY,
              name TEXT
          );
          CREATE TABLE channels (
              id INTEGER PRIMARY KEY,
              name TEXT,
              slug TEXT,
              failback_interval INTEGER NOT NULL DEFAULT 30
          );
          INSERT INTO channels(id, name, slug, failback_interval)
          VALUES (1, 'Legacy Channel', 'legacy-channel', 30);
          ''')
          conn.commit()
          conn.close()

          from app.db import ensure_runtime_schema

          ensure_runtime_schema()
          ensure_runtime_schema()

          conn = sqlite3.connect(path)
          info = {row[1]: row for row in conn.execute('PRAGMA table_info(channels)')}
          assert 'dead_input_recovery_interval' in info, info.keys()
          column = info['dead_input_recovery_interval']
          assert column[3] == 1, column
          assert str(column[4]).strip("'") == '30', column

          existing = conn.execute(
              'SELECT dead_input_recovery_interval FROM channels WHERE id=1'
          ).fetchone()[0]
          assert existing == 30, existing

          conn.execute("INSERT INTO channels(id, name, slug) VALUES (2, 'New Channel', 'new-channel')")
          conn.commit()
          inserted = conn.execute(
              'SELECT dead_input_recovery_interval FROM channels WHERE id=2'
          ).fetchone()[0]
          assert inserted == 30, inserted
          conn.close()

          print('OK: additive migration is idempotent; existing/new rows default to 30 minutes')
          PY

      - name: Live-simulate all inputs failing and recovery to primary
        env:
          STREAMFORGE_DATABASE_URL: sqlite:////tmp/streamforge-v1242-live-sim.db
          STREAMFORGE_REDIS_ENABLED: '0'
          STREAMFORGE_HLS_ROOT: /tmp/streamforge-v1242-hls
        run: |
          rm -f /tmp/streamforge-v1242-live-sim.db
          rm -rf /tmp/streamforge-v1242-hls
          python3 - <<'PY'
          import threading

          from app.db import Base, SessionLocal, engine
          from app.models import Channel
          import app.ffmpeg as ffmpeg_mod
          from app.ffmpeg import StreamManager

          Base.metadata.create_all(engine)

          with SessionLocal() as db:
              channel = Channel(
                  name='Recovery Simulation',
                  slug='recovery-simulation',
                  input_url='http://dead-primary.invalid/live.m3u8',
                  backup_inputs='http://dead-backup-1.invalid/live.m3u8\nhttp://dead-backup-2.invalid/live.m3u8',
                  active_input_index=0,
                  dead_input_recovery_interval=10,
                  enabled=True,
                  auto_restart=True,
                  desired_running=True,
                  status='running',
              )
              db.add(channel)
              db.commit()
              channel_id = channel.id

          captured = []

          class CaptureTimer:
              def __init__(self, delay, function, args=(), kwargs=None):
                  self.delay = delay
                  self.function = function
                  self.args = args
                  self.kwargs = kwargs or {}
                  self.daemon = False
                  self.started = False
                  self.cancelled = False
                  captured.append(self)

              def start(self):
                  self.started = True

              def cancel(self):
                  self.cancelled = True

              def is_alive(self):
                  return self.started and not self.cancelled

          real_timer = ffmpeg_mod.threading.Timer
          ffmpeg_mod.threading.Timer = CaptureTimer
          try:
              manager = StreamManager()

              def set_index(value):
                  with SessionLocal() as db:
                      row = db.get(Channel, channel_id)
                      row.active_input_index = value
                      db.commit()

              def clear_reserved_timer():
                  with manager._lock:
                      manager._restart_timers.pop(channel_id, None)

              # Failure #1: primary failed. Normal short retry/failover remains fast.
              set_index(1)
              manager._schedule_auto_restart(channel_id, 'simulated primary failure')
              assert captured[-1].delay == 3, captured[-1].delay
              print(f'OK: failure 1/3 scheduled quick retry in {captured[-1].delay}s')
              clear_reserved_timer()

              # Failure #2: backup #1 failed. Still short backoff.
              set_index(2)
              manager._schedule_auto_restart(channel_id, 'simulated backup 1 failure')
              assert captured[-1].delay == 5, captured[-1].delay
              print(f'OK: failure 2/3 scheduled quick retry in {captured[-1].delay}s')
              clear_reserved_timer()

              # Failure #3: backup #2 failed. Full cycle is exhausted.
              manager._schedule_auto_restart(channel_id, 'simulated backup 2 failure')
              long_timer = captured[-1]
              assert long_timer.delay == 600, long_timer.delay

              with SessionLocal() as db:
                  row = db.get(Channel, channel_id)
                  assert row.active_input_index == 0, row.active_input_index
                  assert 'all 3 input(s) failed' in (row.last_error or ''), row.last_error
                  assert 'next full input recovery in 10 minute(s)' in (row.last_error or ''), row.last_error
              print('OK: all 3 inputs failed; configured recovery delay captured as 600s (10 minutes)')
              print('OK: full failed cycle reset active_input_index to primary (0) before recovery')

              observed = {}

              def simulated_successful_start(cid, *, recovery=False):
                  assert cid == channel_id
                  assert recovery is True
                  with SessionLocal() as db:
                      row = db.get(Channel, cid)
                      observed['input_index_at_recovery'] = row.active_input_index
                      row.status = 'running'
                      row.pid = 424242
                      row.last_error = None
                      db.commit()

              manager.start = simulated_successful_start

              # Fire the captured long-delay callback immediately; no wall-clock wait.
              long_timer.function(*long_timer.args, **long_timer.kwargs)

              with SessionLocal() as db:
                  row = db.get(Channel, channel_id)
                  assert observed['input_index_at_recovery'] == 0, observed
                  assert row.active_input_index == 0, row.active_input_index
                  assert row.status == 'running', row.status
                  assert row.pid == 424242, row.pid

              assert manager._restart_attempts.get(channel_id, 0) == 0
              print('OK: recovery callback restarted from primary input and reached running state')
              print('OK: consecutive failure counter remained reset for the new recovery cycle')
          finally:
              ffmpeg_mod.threading.Timer = real_timer
          PY

      - name: Compile changed Python
        run: >-
          python3 -m py_compile
          app/models.py app/db.py app/main.py app/ffmpeg.py app/recovery_policy.py
          scripts/verify_dead_input_recovery_interval_v1242.py
          scripts/verify_dead_input_recovery_policy_v1242.py
