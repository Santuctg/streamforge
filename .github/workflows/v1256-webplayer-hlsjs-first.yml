name: v12.56 Web Player HLS.js First

on:
  push:
    branches:
      - hotfix/v12.56-webplayer-hlsjs-first
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/player.html
      - node_agent/app.py
      - scripts/apply_v1256_webplayer_hlsjs_first.py
      - scripts/verify_webplayer_hlsjs_first_v1256.py
      - scripts/test_v1256_updater_integration.py
      - scripts/force_update_v1256.sh
      - .github/workflows/v1256-webplayer-hlsjs-first.yml
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/templates/player.html
      - node_agent/app.py
      - scripts/apply_v1256_webplayer_hlsjs_first.py
      - scripts/verify_webplayer_hlsjs_first_v1256.py
      - scripts/test_v1256_updater_integration.py
      - scripts/force_update_v1256.sh
      - .github/workflows/v1256-webplayer-hlsjs-first.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v12.56 HLS.js-first source transformation
        run: |
          result="$(python3 scripts/apply_v1256_webplayer_hlsjs_first.py .)"
          [[ "$result" == "FIXED" || "$result" == "ALREADY_FIXED" ]]
          test "$(python3 scripts/apply_v1256_webplayer_hlsjs_first.py .)" = "ALREADY_FIXED"
      - name: Verify HLS.js-first browser engine selection
        run: python3 scripts/verify_webplayer_hlsjs_first_v1256.py .
      - name: Verify v12.56 updater integration
        run: python3 scripts/test_v1256_updater_integration.py
      - name: Verify carry-forward playback/recovery guards
        run: |
          grep -Fq 'STREAMFORGE_WEBPLAYER_PERSISTENT_AUTO_RECONNECT_V3055' app/templates/player.html
          grep -Fq 'STREAMFORGE_WEBPLAYER_NON_DESTRUCTIVE_STALL_RECOVERY_V1167' app/templates/player.html
          grep -Fq 'STREAMFORGE_NODE_RELAY_HEALTH_PROBE_SINGLE_OWNER_V1251' node_agent/app.py
          python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
          python3 - <<'PY'
          from pathlib import Path
          compile(Path('node_agent/app.py').read_text(encoding='utf-8'), 'node_agent/app.py', 'exec')
          compile(Path('scripts/apply_v1256_webplayer_hlsjs_first.py').read_text(encoding='utf-8'), 'apply_v1256', 'exec')
          compile(Path('scripts/verify_webplayer_hlsjs_first_v1256.py').read_text(encoding='utf-8'), 'verify_v1256', 'exec')
          compile(Path('scripts/test_v1256_updater_integration.py').read_text(encoding='utf-8'), 'test_v1256_updater', 'exec')
          print('PASS: v12.56 Python syntax verified without bytecode output')
          PY
