name: v12.45 relay log protection

on:
  push:
    branches:
      - hotfix/v12.45-relay-log-protection
  pull_request:
    paths:
      - deploy/nginx.conf
      - scripts/apply_main_access.py
      - scripts/force_update_v1245.sh
      - scripts/verify_relay_log_protection_v1245.py
      - .github/workflows/v1245-relay-log-protection.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay log protection
        run: python3 scripts/verify_relay_log_protection_v1245.py
