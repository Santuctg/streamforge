name: Publish StreamForge Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - release-notes/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamforge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Carry release source fixes into release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == "12.50" ]]; then
            # STREAMFORGE_V1250_RELEASE_SOURCE_CARRY:
            python3 scripts/apply_v1250_main_fix.py app/main.py
            python3 scripts/verify_local_relay_db_close_v1250.py app/main.py
            python3 -m py_compile app/main.py
            if ! git diff --quiet -- app/main.py; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/main.py
              git commit -m "Integrate v12.50 local relay DB-close fix"
              git push origin HEAD:main
            fi
          elif [[ "$version" == "12.51" ]]; then
            # STREAMFORGE_V1251_NODE_RELAY_PROBE_RELEASE_SOURCE_CARRY:
            test "$(tr -d '[:space:]' < node_agent/VERSION)" = "12.51"
            grep -Fq 'STREAMFORGE_LOCAL_RELAY_DB_CLOSE_V1250' app/main.py
            python3 scripts/apply_v1251_node_recovery_probe_fix.py node_agent/app.py
            python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
            python3 -m py_compile node_agent/app.py
            if ! git diff --quiet -- node_agent/app.py; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add node_agent/app.py
              git commit -m "Integrate v12.51 Node relay health-probe dedupe fix"
              git push origin HEAD:main
            fi
          elif [[ "$version" == "12.52" ]]; then
            # STREAMFORGE_V1252_UPDATER_CACHE_HYGIENE_RELEASE_GUARD:
            test "$(tr -d '[:space:]' < node_agent/VERSION)" = "12.52"
            grep -Fq 'STREAMFORGE_LOCAL_RELAY_DB_CLOSE_V1250' app/main.py
            grep -Fq 'STREAMFORGE_NODE_RELAY_HEALTH_PROBE_SINGLE_OWNER_V1251' node_agent/app.py
            grep -Fq 'STREAMFORGE_V1252_NO_SOURCE_BYTECODE' scripts/force_update_v1252.sh
            python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
            python3 scripts/verify_release_updater_staging.py
            python3 - node_agent/app.py <<'PYV1252'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PYV1252
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dedicated="release-notes/v${version}.md"
          if [[ -s "$dedicated" ]]; then
            cp "$dedicated" release-notes.md
          else
            awk -v version="$version" '
              $0 ~ "^## " version "([[:space:]]|$)" {capture=1; next}
              capture && /^## [0-9]+\.[0-9]+/ {exit}
              capture {print}
            ' CHANGELOG.md > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            printf 'StreamForge v%s\n' "$version" > release-notes.md
          fi

      - name: Publish tag, GitHub Release, and update ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "StreamForge v$VERSION" \
              --notes-file release-notes.md
          else
            echo "Release $TAG already exists; ensuring its update ZIP is present."
          fi

          git fetch --tags --force
          package="streamforge-$VERSION.zip"
          git archive --format=zip --prefix="streamforge-$VERSION/" "$TAG" -o "$package"
          test -s "$package"
          unzip -l "$package" | grep -F "streamforge-$VERSION/VERSION"
          unzip -p "$package" "streamforge-$VERSION/VERSION" | grep -Fx "$VERSION"

          if [[ "$VERSION" == "12.51" || "$VERSION" == "12.52" ]]; then
            unzip -p "$package" "streamforge-$VERSION/node_agent/VERSION" | grep -Fx "$VERSION"
            unzip -p "$package" "streamforge-$VERSION/node_agent/app.py" \
              | grep -Fq 'STREAMFORGE_NODE_RELAY_HEALTH_PROBE_SINGLE_OWNER_V1251'
            unzip -p "$package" "streamforge-$VERSION/app/main.py" \
              | grep -Fq 'STREAMFORGE_LOCAL_RELAY_DB_CLOSE_V1250'
          fi
          if [[ "$VERSION" == "12.52" ]]; then
            unzip -p "$package" "streamforge-$VERSION/scripts/force_update_v1252.sh" \
              | grep -Fq 'STREAMFORGE_V1252_NO_SOURCE_BYTECODE'
            if unzip -p "$package" "streamforge-$VERSION/scripts/force_update_v1252.sh" \
              | grep -Fq 'python3 -m py_compile "$SOURCE_DIR/node_agent/app.py"'; then
              echo "v12.52 updater still contains source-tree py_compile regression" >&2
              exit 1
            fi
          fi

          gh release upload "$TAG" "$package" \
            --repo "$GITHUB_REPOSITORY" --clobber
