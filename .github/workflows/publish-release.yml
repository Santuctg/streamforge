name: Publish StreamForge Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - release-notes/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamforge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dedicated="release-notes/v${version}.md"
          if [[ -s "$dedicated" ]]; then
            cp "$dedicated" release-notes.md
          else
            awk -v version="$version" '
              $0 ~ "^## " version "([[:space:]]|$)" {capture=1; next}
              capture && /^## [0-9]+\.[0-9]+/ {exit}
              capture {print}
            ' CHANGELOG.md > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            printf 'StreamForge v%s\n' "$version" > release-notes.md
          fi

      - name: Publish tag, GitHub Release, and update ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "StreamForge v$VERSION" \
              --notes-file release-notes.md
          else
            echo "Release $TAG already exists; ensuring its update ZIP is present."
          fi

          # Package the exact release tag with one top-level directory so
          # streamforge-update receives the expected source tree.
          git fetch --tags --force
          package="streamforge-$VERSION.zip"
          git archive --format=zip --prefix="streamforge-$VERSION/" "$TAG" -o "$package"
          test -s "$package"
          unzip -l "$package" | grep -F "streamforge-$VERSION/VERSION"
          unzip -p "$package" "streamforge-$VERSION/VERSION" | grep -Fx "$VERSION"

          # Existing releases can be repaired safely; replace the same-named
          # asset if a previous workflow attempt uploaded an incomplete package.
          gh release upload "$TAG" "$package" \
            --repo "$GITHUB_REPOSITORY" --clobber
