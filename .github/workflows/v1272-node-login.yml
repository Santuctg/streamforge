name: v12.72 Node Login Dark Responsive UI
on:
  push:
    branches:
      - feature/v12.72-node-panel-login-dark-ui
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - node_agent/app.py
      - scripts/force_update_v1272.sh
      - scripts/test_v1272_node_login.py
      - scripts/test_v1272_updater.py
      - scripts/verify_release_updater_staging.py
      - scripts/verify_panel_credential_vault_v1263.py
      - .github/workflows/v1272-node-login.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Node login UI and unchanged live-auth flow
        run: python3 scripts/test_v1272_node_login.py
      - name: Test historical v12.72 updater only on v12.72
        shell: bash
        run: |
          if [[ "$(cat VERSION)" == "12.72" ]]; then
            python3 scripts/test_v1272_updater.py
          else
            echo 'v12.72 updater test skipped for newer release.'
          fi
      - name: Verify preserved Main vault, IP policy and Node security
        run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Verify release staging and safe restart scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1272.sh
          bash -n scripts/update.sh
          if [[ "$(cat VERSION)" == "12.72" ]]; then
            grep -Fq 'force_update_v1272.sh' scripts/update.sh
          fi
          grep -Fq 'STREAMFORGE_V1272_NODE_LOGIN_ONLY_PARITY' scripts/force_update_v1272.sh
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+(nginx|streamforge-channel-supervisor)' scripts/force_update_v1272.sh; then exit 1; fi
          git diff --check
      - name: Verify version and notes
        shell: bash
        run: |
          if [[ "$(cat VERSION)" == "12.72" ]]; then
            test "$(cat node_agent/VERSION)" = "12.72"
          else
            echo 'Historical v12.72 version check skipped.'
          fi
          grep -Fq 'dark' release-notes/v12.72.md
          grep -Fq 'Node Updates' release-notes/v12.72.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.72.zip' release-notes/v12.72.md
