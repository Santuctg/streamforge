name: v12.77 Password Policy and Node Headers
on:
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - node_agent/app.py
      - app/**
      - scripts/reset_admin.py
      - scripts/apply_v1277_security.py
      - scripts/apply_v1277_security.json
      - scripts/force_update_v1277.sh
      - scripts/test_v1277_*.py
      - scripts/update.sh
      - scripts/verify_release_updater_staging.py
      - scripts/verify_panel_credential_vault_v1263.py
      - .github/workflows/v1277-password-policy.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Main runtime dependencies
        run: python3 -m pip install -q -r requirements.txt httpx
      - name: Panel password policy and forced change
        shell: bash
        run: |
          python3 scripts/test_v1277_password_policy.py > test.log 2>&1 && cat test.log || {
            tail -9 test.log | tac | while IFS= read -r line; do echo "::error title=test_v1277_password_policy.py::$line"; done
            exit 1
          }
      - name: Node Panel security headers
        shell: bash
        run: |
          python3 scripts/test_v1277_node_headers.py > test.log 2>&1 && cat test.log || {
            tail -9 test.log | tac | while IFS= read -r line; do echo "::error title=test_v1277_node_headers.py::$line"; done
            exit 1
          }
      - name: Node login page unchanged
        run: python3 scripts/test_v1272_node_login.py
      - name: Verify integrated Main, vault and IP guard contracts
        run: python3 scripts/verify_panel_credential_vault_v1263.py
      - name: Test staged update and rollback
        run: python3 scripts/test_v1277_updater.py
      - name: Verify release staging and safe restart scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_updater_staging.py
          bash -n scripts/force_update_v1277.sh
          bash -n scripts/update.sh
          if [[ "$(cat VERSION)" == "12.77" ]]; then
            grep -Fq 'force_update_v1277.sh' scripts/update.sh
          fi
          if grep -Eq 'systemctl[[:space:]]+(restart|reload)[[:space:]]+(nginx|streamforge-channel-supervisor)' scripts/force_update_v1277.sh; then exit 1; fi
          git diff --check
      - name: Verify version and notes
        shell: bash
        run: |
          if [[ "$(cat VERSION)" == "12.77" ]]; then
            test "$(cat node_agent/VERSION)" = "12.77"
          else
            echo 'Historical v12.77 version check skipped.'
          fi
          grep -Fq '12 characters' release-notes/v12.77.md
          grep -Fq 'Node Updates' release-notes/v12.77.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.77.zip' release-notes/v12.77.md
