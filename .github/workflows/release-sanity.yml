name: Release sanity

on:
  pull_request:
    paths:
      - VERSION
      - node_agent/VERSION
      - app/static/dashboard.js
      - node_agent/app.py
      - deploy/nginx.conf
      - scripts/apply_main_access.py
      - scripts/update.sh
      - scripts/force_update_v*.sh
      - scripts/verify_release_updater_staging.py
      - scripts/verify_node_tls_reconcile_fix.py
      - scripts/verify_node_access_panel_cleanup.py
      - scripts/verify_v1243_schema_order.py
      - scripts/verify_v1244_updater_carry.py
      - scripts/verify_dashboard_datetime_parity_v1244.py
      - scripts/verify_dead_input_recovery_interval_v1242.py
      - scripts/verify_dead_input_recovery_policy_v1242.py
      - scripts/verify_relay_log_protection_v1245.py
      - scripts/verify_v1246_updater_relay_guard.py
      - scripts/verify_relay_log_volume_v1247.py
      - scripts/verify_relay_log_volume_v1248.py
      - scripts/verify_node_relay_probe_dedupe_v1251.py
      - scripts/verify_main_waiting_retry_v1253.py
      - scripts/sync_main_static_cache.py
      - scripts/test_main_static_cache_sync_v1254.py
      - scripts/test_v1254_updater_static_cache_integration.py
      - scripts/test_v1255_version_alignment.py
      - scripts/test_v1255_updater_integration.py
      - scripts/fetch_hlsjs.sh
      - release-notes/**
      - .github/workflows/publish-release.yml
      - .github/workflows/release-sanity.yml
      - .github/workflows/v1244-dashboard-datetime.yml
      - .github/workflows/v1245-relay-log-protection.yml
      - .github/workflows/v1246-updater-relay-guard.yml
      - .github/workflows/v1247-relay-log-volume.yml
      - .github/workflows/v1248-relay-log-volume.yml
      - .github/workflows/v1251-node-relay-probe-dedupe.yml
      - .github/workflows/v1253-main-waiting-retry.yml
      - .github/workflows/v1254-main-static-cache.yml
      - .github/workflows/v1255-version-alignment.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current versions and updater
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          node_version="$(tr -d '[:space:]' < node_agent/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+$ ]]
          # STREAMFORGE_V1254_MAIN_ONLY_RELEASE_SANITY:
          # v12.53/v12.54 are historical Main-only releases. From v12.55
          # onward Main and bundled Node Agent are aligned again.
          if [[ "$version" == "12.53" || "$version" == "12.54" ]]; then
            [[ "$node_version" == "12.52" ]]
          else
            [[ "$node_version" == "$version" ]]
          fi
          compact="${version//./}"
          updater="scripts/force_update_v${compact}.sh"
          test -f "$updater"
          grep -Fq "$(basename "$updater")" scripts/update.sh
          bash -n "$updater"
          bash -n scripts/update.sh
      - name: Verify updater staging cleanup regression
        run: python3 scripts/verify_release_updater_staging.py
      - name: Verify Node Access Panel cleanup
        run: python3 scripts/verify_node_access_panel_cleanup.py
      - name: Verify TLS regression guard
        run: python3 scripts/verify_node_tls_reconcile_fix.py
      - name: Verify dead-input recovery regression
        run: |
          python3 scripts/verify_dead_input_recovery_interval_v1242.py
          python3 scripts/verify_dead_input_recovery_policy_v1242.py
      - name: Verify schema-order hotfix carry-forward
        run: python3 scripts/verify_v1244_updater_carry.py
      - name: Verify Main/Node dashboard date-time parity
        run: python3 scripts/verify_dashboard_datetime_parity_v1244.py
      - name: Verify v12.45 relay log protection
        run: python3 scripts/verify_relay_log_protection_v1245.py
      - name: Verify v12.46 updater relay guard compatibility
        run: python3 scripts/verify_v1246_updater_relay_guard.py
      - name: Verify v12.48 relay log-volume carry-forward
        run: python3 scripts/verify_relay_log_volume_v1248.py
      - name: Verify v12.51 Node relay probe guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.51" ]]; then
            python3 scripts/apply_v1251_node_recovery_probe_fix.py node_agent/app.py
            python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
            python3 -m py_compile node_agent/app.py
          else
            python3 scripts/verify_node_relay_probe_dedupe_v1251.py node_agent/app.py
          fi
      - name: Verify v12.53 Main waiting recovery
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" == "12.53" || "$version" == "12.54" || "$version" == "12.55" ]]; then
            python3 scripts/verify_main_waiting_retry_v1253.py .
          fi
      - name: Verify v12.54 Main static cache sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.54" ]]; then
            python3 scripts/test_main_static_cache_sync_v1254.py
            python3 scripts/test_v1254_updater_static_cache_integration.py
            grep -Fq 'STREAMFORGE_MAIN_STATIC_CACHE_SYNC_V1254' scripts/force_update_v1254.sh
            grep -Fq 'STREAMFORGE_V1254_NO_SOURCE_BYTECODE' scripts/force_update_v1254.sh
          fi
      - name: Verify v12.55 Main/Node alignment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(tr -d '[:space:]' < VERSION)" == "12.55" ]]; then
            python3 scripts/test_main_static_cache_sync_v1254.py
            python3 scripts/test_v1255_version_alignment.py
            python3 scripts/test_v1255_updater_integration.py
            grep -Fq 'STREAMFORGE_VERSION_ALIGNMENT_V1255' scripts/force_update_v1255.sh
            grep -Fq 'STREAMFORGE_MAIN_STATIC_CACHE_SYNC_V1254' scripts/force_update_v1255.sh
            grep -Fq 'STREAMFORGE_MAIN_WAITING_RECOVERY_V1253' scripts/force_update_v1255.sh
            grep -Fq 'STREAMFORGE_NODE_RELAY_HEALTH_PROBE_SINGLE_OWNER_V1251' scripts/force_update_v1255.sh
          fi
      - name: Verify v12.46 release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s release-notes/v12.46.md
          grep -Fq 'v10.68 fresh relay access-log filter missing' release-notes/v12.46.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.46.zip' release-notes/v12.46.md
      - name: Verify v12.47 release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s release-notes/v12.47.md
          grep -Fq 'fallback logging' release-notes/v12.47.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.47.zip' release-notes/v12.47.md
      - name: Verify v12.48 release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s release-notes/v12.48.md
          grep -Fq 'composite' release-notes/v12.48.md
          grep -Fq 'streamforge-update --force /root/streamforge-12.48.zip' release-notes/v12.48.md
      - name: Verify current release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -s "release-notes/v${version}.md"
          grep -Fq "streamforge-update --force /root/streamforge-${version}.zip" "release-notes/v${version}.md"
      - name: Verify Python syntax
        run: python3 -m compileall -q app node_agent scripts
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
